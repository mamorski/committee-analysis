[project]
name = "committee-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=25.1.0",
    "jupyterlab>=4.4.6",
    "jupyterlab-lsp>=5.2.0",
    "matplotlib>=3.10.5",
    "networkx>=3.5",
    "numpy>=2.3.2",
    "pandas>=2.3.3",
    "pyvis>=0.3.2",
    "python-telegram-bot>=21",
    "scipy>=1.16.1",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]

[project.scripts]
committee-sim = "committee_sim.run_simulations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/committee_sim"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
